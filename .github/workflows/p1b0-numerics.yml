name: P1-B0 numerical laboratory (synthetic only)

on:
  pull_request:
  push:
    branches: [chatgpt/p1b0-numerical-lab-20261025]

permissions:
  contents: read

jobs:
  numeric:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install pinned lab dependencies only
        run: python -m pip install 'numpy==2.3.5' 'scipy==1.17.0'
      - name: Compile laboratory
        run: python -m compileall -q research/p1b0_numerics
      - name: Run numerical counterexamples and synthetic training
        run: python -m unittest discover -s research/p1b0_numerics -p 'test_*.py' -v
      - name: Run 15-case synthetic preflight
        run: python research/p1b0_numerics/preflight.py > p1b0_preflight.json
      - name: Run constructed bimodal learning experiment
        run: python research/p1b0_numerics/synthetic_fit.py > p1b0_synthetic_fit.json
      - name: Run constructed 20-step price evaluation
        run: python research/p1b0_numerics/rollout_study.py > p1b0_rollout_study.json
      - name: Upload reproducible synthetic reports
        uses: actions/upload-artifact@v4
        with:
          name: trame-p1b0-synthetic-reports
          path: |
            p1b0_preflight.json
            p1b0_synthetic_fit.json
            p1b0_rollout_study.json
