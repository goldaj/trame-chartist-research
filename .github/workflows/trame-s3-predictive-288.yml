name: TRAME S3.1A 288 real BTC grammar fits
on:
  push:
    branches:
      - chatgpt/trame-s3-predictive-grammars-20261026
    paths:
      - .github/workflows/trame-s3-predictive-192.yml
  workflow_dispatch:
permissions:
  contents: read
jobs:
  grammar-192:
    strategy:
      fail-fast: false
      matrix:
        interval: [D1, H1, M1]
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      INTERVAL: ${{ matrix.interval }}
      TRAME_BTC_CACHE_DIR: /tmp/trame-btc-s3-real
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Pin CPU scientific dependencies
        run: |
          python -m pip install 'numpy==2.3.5' 'scipy==1.17.0'
          python -m pip install 'torch==2.10.0' --index-url https://download.pytorch.org/whl/cpu
      - name: Fetch and verify public Bitstamp source at immutable upstream SHA
        run: |
          python -m research.data.public_data --resolution "$INTERVAL" --directory "$TRAME_BTC_CACHE_DIR"
          python -m research.data.public_data --resolution "$INTERVAL" --directory "$TRAME_BTC_CACHE_DIR" --check-only
      - name: Run 96 paired grammar models on REAL BTC at this horizon
        run: |
          mkdir -p evidence
          if [ "$INTERVAL" = D1 ]; then DATA_DIR=research/data/reference; else DATA_DIR="$TRAME_BTC_CACHE_DIR"; fi
          python -m research.token_grammar.predictive \
            --interval "$INTERVAL" --directory "$DATA_DIR" \
            --data-origin BTC_PUBLIC_REAL \
            --grammars continuous_bps legacy_quantized_bps signed_uniform_g1 signed_quantile_g2 \
            --modes regression joint \
            --widths 16 32 --depths 1 2 \
            --seeds 20261025 20261026 20261027 \
            --steps 200 \
            --output "evidence/${INTERVAL}_S3_1A_288_real.json"
      - name: Enforce preregistered pairing, label-year freeze and data provenance
        run: |
          python - <<'PY'
          import hashlib,json,math,os
          from pathlib import Path
          iv=os.environ["INTERVAL"];f=Path(f"evidence/{iv}_S3_1A_288_real.json")
          d=json.loads(f.read_text(encoding="utf-8"))
          assert d["interval"]==iv and d["data_origin"]=="BTC_PUBLIC_REAL"
          assert d["experiment"]=="TRAME_S3_1A_PREDICTIVE_GRAMMAR_V1"
          assert d["quantile_fit_on"]=="TRAIN_PAST_CONTEXTS_ONLY"
          assert not d["labels_2026_opened"] and not d["independent_test_used"]
          assert d["same_input_normalization_all_representations"]
          assert d["same_target_normalization_all_representations"]
          assert d["common_batch_indices_per_seed"]
          assert d["seeds"]==[20261025,20261026,20261027]
          assert len(d["results"])==96 and d["steps"]==200 and d["dev_count"]==1024
          from research.token_grammar.predictive_panel import build_panel
          # The single-horizon panel validates all strict 4-way pairings.
          p=build_panel([d])
          assert p["n_fits"]==96 and p["paired_groups"]==24
          assert len(p["summary"])==8
          assert all(math.isfinite(r["mae_bps_anchor"]) for r in d["results"])
          print("REAL S3.1A",iv,"96 fits validated","sha256",hashlib.sha256(f.read_bytes()).hexdigest())
          PY
      - name: Save aggregate fit results, no raw BTC prices
        uses: actions/upload-artifact@v4
        with:
          name: trame-s3-1A-${{ matrix.interval }}-96fits-200steps
          path: evidence/*.json
          if-no-files-found: error
          retention-days: 30

  summarise-288:
    needs: grammar-192
    runs-on: ubuntu-latest
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install read-only report dependencies
        run: |
          python -m pip install 'numpy==2.3.5' 'scipy==1.17.0'
          python -m pip install 'torch==2.10.0' --index-url https://download.pytorch.org/whl/cpu
      - uses: actions/download-artifact@v4
        with:
          pattern: trame-s3-1A-*-96fits-200steps
          path: reports
          merge-multiple: true
      - name: Make honest paired 288-fit table by horizon and loss
        run: |
          mkdir -p summary
          python -m research.token_grammar.predictive_panel \
            --inputs reports/D1_S3_1A_288_real.json reports/H1_S3_1A_288_real.json reports/M1_S3_1A_288_real.json \
            --output summary/s3_1A_all_288_comparison.json \
            --markdown summary/s3_1A_all_288_comparison.md
          python - <<'PY'
          import json
          from pathlib import Path
          d=json.loads(Path("summary/s3_1A_all_288_comparison.json").read_text())
          assert d["n_fits"]==288 and d["paired_groups"]==72
          assert len(d["summary"])==24
          assert len(d["paired_deltas"])==18
          assert d["independent_test"] is False and d["labels_2026_opened"] is False
          print(Path("summary/s3_1A_all_288_comparison.md").read_text())
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: trame-s3-1A-288-final-metrics-and-table
          path: summary/*
          if-no-files-found: error
          retention-days: 30
