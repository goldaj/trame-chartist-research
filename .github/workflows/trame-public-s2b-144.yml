name: TRAME public BTC S2b three-seed full representation ablation
on:
  push:
    branches:
      - chatgpt/trame-public-btc-data-import-20261026
    paths:
      - .github/workflows/trame-public-s2b-144.yml
  workflow_dispatch:
permissions:
  contents: read
jobs:
  public-s2b-full:
    strategy:
      fail-fast: false
      matrix:
        interval: [D1, H1, M1]
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      INTERVAL: ${{ matrix.interval }}
      TRAME_BTC_CACHE_DIR: /tmp/trame-bitstamp-public
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Pinned CPU-only research dependencies
        run: |
          python -m pip install 'numpy==2.3.5' 'scipy==1.17.0'
          python -m pip install 'torch==2.10.0' --index-url https://download.pytorch.org/whl/cpu
      - name: Verify and install original Bitstamp history, PUBLIC source only
        run: |
          set -euo pipefail
          python -m research.data.public_data --resolution "$INTERVAL" --directory "$TRAME_BTC_CACHE_DIR" > /tmp/data_provenance.json
          python -m research.data.public_data --resolution "$INTERVAL" --directory "$TRAME_BTC_CACHE_DIR" --check-only > /dev/null
      - name: D1 H1 M1 paired representation ablation (48 fits per horizon)
        run: |
          mkdir -p results
          python -m research.representation_ablation.runner \
            --interval "$INTERVAL" \
            --directory "$TRAME_BTC_CACHE_DIR" \
            --data-origin BTC_PUBLIC_REAL \
            --representations continuous_bps legacy_quantized_bps \
            --modes regression joint \
            --widths 16 32 --depths 1 2 \
            --seeds 20261025 20261026 20261027 \
            --steps 200 \
            --output "results/${INTERVAL}_public_s2b_200steps_3seeds.json"
      - name: Assert real BTC reproducibility, 2026 freeze and paired coverage
        run: |
          python - <<'PY'
          import os, json, math, hashlib
          from pathlib import Path
          iv=os.environ["INTERVAL"]
          path=Path(f"results/{iv}_public_s2b_200steps_3seeds.json")
          data=json.loads(path.read_text(encoding="utf-8"))
          assert data["data_origin"]=="BTC_PUBLIC_REAL" and data["interval"]==iv
          assert data["steps"]==200 and data["seeds"]==[20261025,20261026,20261027]
          assert data["labels_2026_opened"] is False and data["independent_test_used"] is False
          assert data["same_input_normalization_all_representations"] is True
          assert data["same_target_normalization_all_representations"] is True
          assert len(data["results"])==48
          pairs={}
          for row in data["results"]:
              assert math.isfinite(row["mae_bps_anchor"])
              assert math.isfinite(row["absolute_magnitude_error_bps"])
              key=(row["mode"],row["width"],row["depth"],row["seed"])
              pairs.setdefault(key,[]).append(row)
          assert len(pairs)==24
          for pair in pairs.values():
              assert len(pair)==2
              assert pair[0]["initial_state_sha256"]==pair[1]["initial_state_sha256"]
              assert pair[0]["input_normalizer_std_bps"]==pair[1]["input_normalizer_std_bps"]
              assert pair[0]["target_normalizer_std_bps_common"]==pair[1]["target_normalizer_std_bps_common"]
          print("REAL BTC PUBLIC 3-SEED S2B:",iv,"fits=48",
                "train",data["train_count"],"dev",data["dev_count"],
                "sha256",hashlib.sha256(path.read_bytes()).hexdigest())
          print("Development-only result; independent 2026 test UNOPENED; no portfolio PnL.")
          PY
      - name: Save only aggregate research results, user-authorised public
        uses: actions/upload-artifact@v4
        with:
          name: trame-s2b-public-${{ matrix.interval }}-200steps-3seeds
          path: results/*.json
          if-no-files-found: error
          retention-days: 30
