name: TRAME BTC H1 M1 streaming synthetic-fixture tests
on:
  push:
    branches:
      - chatgpt/btc-h1-m1-20261025
  pull_request:
permissions:
  contents: read
jobs:
  test-h1-m1:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install pinned CPU dependencies
        run: |
          python -m pip install 'numpy==2.3.5' 'scipy==1.17.0'
          python -m pip install 'torch==2.10.0' --index-url https://download.pytorch.org/whl/cpu
      - name: Run synthetic compressed archive fixture tests
        run: python -m unittest discover -s research/btc_h1_m1 -p 'test_*.py' -v
      - name: Guard: raw history not committed to workflow branch
        run: |
          test ! -d research/btc_h1_m1/raw || test -z "$(find research/btc_h1_m1/raw -type f -print -quit)"
