name: TRAME S3.1B real learned token embedding fixtures
on:
  push:
    branches:
      - chatgpt/trame-s3-true-token-embeddings-20261026
  pull_request:
permissions:
  contents: read
jobs:
  embedding-gradients:
    runs-on: ubuntu-latest
    timeout-minutes: 22
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install scientific CPU tools
        run: |
          python -m pip install 'numpy==2.3.5' 'scipy==1.17.0'
          python -m pip install 'torch==2.10.0' --index-url https://download.pytorch.org/whl/cpu
      - name: Check true token embeddings receive gradients and reject leakage
        run: |
          python -m unittest research.token_grammar.test_token_embeddings research.token_grammar.test_predictive -v
      - name: Check previous representation comparators unchanged
        run: |
          python -m unittest research.representation_ablation.test_ablation research.token_grammar.test_diagnostics -v
