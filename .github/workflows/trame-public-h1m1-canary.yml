name: TRAME public H1 M1 real data research canaries
on:
  push:
    branches:
      - chatgpt/trame-public-btc-data-import-20261026
permissions:
  contents: read
jobs:
  public-hour-minute:
    strategy:
      fail-fast: false
      matrix:
        interval: [H1, M1]
    runs-on: ubuntu-latest
    timeout-minutes: 65
    env:
      INTERVAL: ${{ matrix.interval }}
      TRAME_BTC_CACHE_DIR: /tmp/trame-btc-public
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Pin research CPU environment
        run: |
          python -m pip install 'numpy==2.3.5' 'scipy==1.17.0'
          python -m pip install 'torch==2.10.0' --index-url https://download.pytorch.org/whl/cpu
      - name: Fetch public H1/M1 archives and VERIFY every pinned Git blob
        run: |
          set -euo pipefail
          python -m research.data.public_data --resolution "$INTERVAL" --directory "$TRAME_BTC_CACHE_DIR" > data_provenance.json
          python -m research.data.public_data --resolution "$INTERVAL" --directory "$TRAME_BTC_CACHE_DIR" --check-only > /dev/null
      - name: Run S2b authentic BTC input-codec ablation (4 arms)
        run: |
          mkdir -p out
          python -m research.representation_ablation.runner \
            --interval "$INTERVAL" --directory "$TRAME_BTC_CACHE_DIR" \
            --data-origin BTC_PUBLIC_REAL \
            --representations continuous_bps legacy_quantized_bps \
            --modes regression joint \
            --widths 16 --depths 1 --steps 40 \
            --seeds 20261026 \
            --output "out/${INTERVAL}_public_s2b_canary.json"
      - name: Audit information loss on the same REAL H1/M1 histories
        run: |
          python -m research.token_grammar.audit \
            --interval "$INTERVAL" --directory "$TRAME_BTC_CACHE_DIR" \
            --data-origin BTC_PUBLIC_REAL \
            --output "out/${INTERVAL}_public_grammar_info.json"
      - name: Validate source, test quarantine, paired cohorts, reports
        run: |
          python - <<'PY'
          import os,json,hashlib,math
          from pathlib import Path
          interval=os.environ["INTERVAL"]
          root=Path("out")
          a=json.loads((root/f"{interval}_public_s2b_canary.json").read_text())
          g=json.loads((root/f"{interval}_public_grammar_info.json").read_text())
          assert a["data_origin"]==g["data_origin"]=="BTC_PUBLIC_REAL"
          assert a["interval"]==g["interval"]==interval
          assert not a["labels_2026_opened"] and not g["labels_2026_opened"]
          assert not a["independent_test_used"] and not g["independent_test_used"]
          assert a["dev_count"]==g["sampled_development_origins"]==1024
          assert a["development_origins_sha256"]==g["development_origins_sha256"]
          assert len(a["results"])==4 and a["steps"]==40
          assert all(math.isfinite(r["mae_bps_anchor"]) for r in a["results"])
          assert not g["model_trained"] and not g["price_prediction_performed"]
          for p in root.glob("*.json"):
              print("REAL PUBLIC HISTORICAL RESEARCH",p.name,hashlib.sha256(p.read_bytes()).hexdigest())
          PY
      - name: Store only public provenance and aggregate reports
        uses: actions/upload-artifact@v4
        with:
          name: trame-public-${{ matrix.interval }}-real-canary
          path: |
            out/*.json
            data_provenance.json
          if-no-files-found: error
          retention-days: 21
