name: TRAME S3.1A token grammar causal fixtures
on:
  push:
    branches:
      - chatgpt/trame-s3-predictive-grammars-20261026
  pull_request:
permissions:
  contents: read
jobs:
  grammar-prediction-fixtures:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install pinned CPU research libraries
        run: |
          python -m pip install 'numpy==2.3.5' 'scipy==1.17.0'
          python -m pip install 'torch==2.10.0' --index-url https://download.pytorch.org/whl/cpu
      - name: Synthetic S3.1 grammar leakage and strict S2b parity
        run: |
          python -m unittest research.token_grammar.test_predictive research.token_grammar.test_predictive_panel research.token_grammar.test_diagnostics research.token_grammar.test_audit -v
      - name: Regression checks for prior S2b validation
        run: |
          python -m unittest research.representation_ablation.test_ablation research.representation_ablation.test_panel -v
