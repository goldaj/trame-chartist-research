name: TRAME S3 token grammar offline audit fixtures
on:
  push:
    branches:
      - chatgpt/trame-grammar-audit-20261026
  pull_request:
permissions:
  contents: read
jobs:
  grammar-audit:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install CPU research libraries
        run: |
          python -m pip install 'numpy==2.3.5' 'scipy==1.17.0'
          python -m pip install 'torch==2.10.0' --index-url https://download.pytorch.org/whl/cpu
      - name: Train-only fitting, zero token reconstruction, 2026 quarantine
        run: |
          python -m unittest research.token_grammar.test_diagnostics research.token_grammar.test_audit -v
      - name: Verify representation ablation still passes
        run: |
          python -m unittest research.representation_ablation.test_ablation research.representation_ablation.test_panel -v
