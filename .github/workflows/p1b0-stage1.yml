name: P1-B0 full differentiability (synthetic)
on:
  push:
    branches: [chatgpt/p1b0-stage1-validation-20261025]
  pull_request:
permissions:
  contents: read
jobs:
  math:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install CPU-only reproducible toolchain
        run: |
          python -m pip install 'numpy==2.3.5' 'scipy==1.17.0'
          python -m pip install 'torch==2.10.0' --index-url https://download.pytorch.org/whl/cpu
      - name: Check gradients and model invariants
        run: python -m unittest discover -s research/p1b0_numerics -p 'test_*.py' -v
      - name: Run numerical stress
        run: python research/p1b0_numerics/preflight.py > preflight-stage1.json
      - name: Measure CPU full-normalizer costs
        run: python research/p1b0_numerics/benchmark_stage1.py > p1b0_cpu_timings.json
      - name: Upload pure synthetic results
        uses: actions/upload-artifact@v4
        with:
          name: p1b0-stage1-preflight
          path: |
            preflight-stage1.json
            p1b0_cpu_timings.json
