name: TRAME S3.1E 27 REAL BTC coherent-loss trajectories 81 checkpoints
on:
  push:
    branches:
      - chatgpt/trame-s3-reconciliation-loss-20261026
    paths:
      - .github/workflows/trame-s3-1e-27-full.yml
  workflow_dispatch:
permissions:
  contents: read
jobs:
  hard-v-soft-real:
    strategy:
      fail-fast: false
      matrix:
        interval: [D1,H1,M1]
    runs-on: ubuntu-latest
    timeout-minutes: 140
    env:
      INTERVAL: ${{ matrix.interval }}
      TRAME_BTC_CACHE_DIR: /tmp/trame-btc-pre2022
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Fixed scientific CPU environment
        run: |
          python -m pip install 'numpy==2.3.5' 'scipy==1.17.0'
          python -m pip install 'torch==2.10.0' --index-url https://download.pytorch.org/whl/cpu
      - name: CLI preflight and synthetic anti-2022 tests
        run: |
          python -m research.token_grammar.reconciliation_loss --help >/dev/null
          python -m unittest research.token_grammar.test_reconciliation_loss research.token_grammar.test_reconciliation_panel -v
      - name: Fetch original public BTC data with SHA verification
        run: |
          python -m research.data.public_data --resolution "$INTERVAL" --directory "$TRAME_BTC_CACHE_DIR"
          python -m research.data.public_data --resolution "$INTERVAL" --directory "$TRAME_BTC_CACHE_DIR" --check-only
      - name: Train 9 authentic 2000-step trajectories with HARD-price scoring
        run: |
          mkdir -p real
          if [ "$INTERVAL" = D1 ]; then DATA_DIR=research/data/reference; else DATA_DIR="$TRAME_BTC_CACHE_DIR"; fi
          python -m research.token_grammar.reconciliation_loss \
            --interval "$INTERVAL" --directory "$DATA_DIR" \
            --seeds 20261025 20261026 20261027 \
            --checkpoints 200 800 2000 \
            --output "real/${INTERVAL}_S3_1E_9trajectories_27checkpoints.json"
      - name: Strict compare 3 arms per seed and checkpoint, 2022/26 sealed
        run: |
          python - <<'PY'
          from pathlib import Path
          import hashlib,json,os,math
          from research.token_grammar.reconciliation_panel import validate
          iv=os.environ["INTERVAL"]
          path=Path(f"real/{iv}_S3_1E_9trajectories_27checkpoints.json")
          d=json.loads(path.read_text())
          validate(d)
          assert d["interval"]==iv and d["data_origin"]=="BTC_PUBLIC_REAL"
          assert d["engineering_canary_not_scientific_selection"] is False
          assert d["external_2022_2025_used"] is False
          assert d["holdout_2026_used"] is False
          assert d["train_count"]>=200 and d["monitor_count"]>=200
          assert len(d["results"])==27
          assert all(math.isfinite(r["mae_native_usd"]) for r in d["results"])
          print("AUTHENTIC S3.1E",iv,"9 separate training trajectories",
            "27 dependent checkpoints, HARD served pricing",
            hashlib.sha256(path.read_bytes()).hexdigest())
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: trame-s3-1E-${{ matrix.interval }}-9-real-trajectories
          path: real/*.json
          if-no-files-found: error
          retention-days: 30

  aggregate-81:
    needs: hard-v-soft-real
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Fixed science reporter toolchain
        run: |
          python -m pip install 'numpy==2.3.5' 'scipy==1.17.0'
          python -m pip install 'torch==2.10.0' --index-url https://download.pytorch.org/whl/cpu
      - uses: actions/download-artifact@v4
        with:
          pattern: trame-s3-1E-*-9-real-trajectories
          path: collected
          merge-multiple: true
      - name: Aggregate 27 independent optimizer paths and 81 temporal observations
        run: |
          mkdir -p final
          python -m research.token_grammar.reconciliation_panel \
            --inputs collected/D1_S3_1E_9trajectories_27checkpoints.json collected/H1_S3_1E_9trajectories_27checkpoints.json collected/M1_S3_1E_9trajectories_27checkpoints.json \
            --output final/S3_1E_hard_price_27paths_81observations.json \
            --markdown final/S3_1E_hard_price_27paths_81observations.md
          python - <<'PY'
          from pathlib import Path
          import hashlib,json
          p=Path("final/S3_1E_hard_price_27paths_81observations.json")
          j=json.loads(p.read_text())
          assert j["n_distinct_trajectories"]==27
          assert j["n_checkpoint_observations"]==81
          assert len(j["summary"])==27 and len(j["paired_deltas"])==18
          assert j["external_dev_2022_2025_used"] is False
          assert j["holdout_2026_used"] is False
          assert j["hard_forecast_is_served"] is True
          assert j["soft_forecast_diagnostics_only"] is True
          print(Path("final/S3_1E_hard_price_27paths_81observations.md").read_text())
          print("FINAL PANEL SHA256",hashlib.sha256(p.read_bytes()).hexdigest())
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: trame-s3-1E-final-81-measurements
          path: final/*
          if-no-files-found: error
          retention-days: 30
