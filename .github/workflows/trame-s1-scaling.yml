name: TRAME S1 scaling direction fixtures
on:
  push:
    branches:
      - chatgpt/trame-scaling-depth-direction-20261026
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  synthetic-scaling:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install CPU only research dependencies
        run: |
          python -m pip install 'numpy==2.3.5' 'scipy==1.17.0'
          python -m pip install 'torch==2.10.0' --index-url https://download.pytorch.org/whl/cpu
      - name: Run fabricated-only adversarial tests
        run: python -m unittest research.scaling_study.test_scaling -v
      - name: Verify all parameter-grid declarations without opening BTC data
        run: |
          python -m research.scaling_study.runner --interval H1 --plan-only > trame_s1_grid.json
          python -c "import json; x=json.load(open('trame_s1_grid.json')); assert len(x['grid']) == 45; assert all(not y['compute_matched'] for y in x['grid'])"
      - name: Save synthetic grid (NOT financial test results)
        uses: actions/upload-artifact@v4
        with:
          name: trame-s1-grid-metadata-only
          path: trame_s1_grid.json
          retention-days: 14
