name: TRAME BTC USD D1 owner-history adapter (offline synthetic fixtures)
on:
  push:
    branches:
      - chatgpt/btc-history-bridge-20261025
  pull_request:
permissions:
  contents: read
jobs:
  btc-history-adapter:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install pinned CPU research dependencies
        run: |
          python -m pip install 'numpy==2.3.5' 'scipy==1.17.0'
          python -m pip install 'torch==2.10.0' --index-url https://download.pytorch.org/whl/cpu
      - name: Test offline BTC CSV loader and three-architecture runner on fabricated series
        run: python -m unittest discover -s research/btc_real_data -p 'test_*.py' -v
      - name: Prevent accidental real-data or keys download during CI
        run: |
          python -c "from pathlib import Path; d=Path('research/btc_real_data/raw'); assert not any(d.glob('*.csv')), 'This CI is intentionally fixture-only; do not add raw BTC historical prices until explicit reviewed workflow'"
