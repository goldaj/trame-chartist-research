name: TRAME stage 2 mini Transformer (synthetic only)
on:
  push:
    branches: [chatgpt/mini-transformer-synthetic-20261025]
  pull_request:
permissions:
  contents: read
jobs:
  stage2:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install pinned CPU dependencies
        run: |
          python -m pip install 'numpy==2.3.5' 'scipy==1.17.0'
          python -m pip install 'torch==2.10.0' --index-url https://download.pytorch.org/whl/cpu
      - name: Run strict causal and training smoke tests
        run: python -m unittest discover -s research/mini_gpt_synthetic -p 'test_*.py' -v
      - name: Run predefined exploratory development training
        run: python -m research.mini_gpt_synthetic.experiment --steps 40 > stage2_development.json
      - name: Summarize developer-only results
        run: |
          python -c "import json; d=json.load(open('stage2_development.json')); print('start development NLL',d['start_development_nll']); print('end development NLL',d['end_development_nll']); print('oracle',d['controls_development']['oracle_known_generator_nll']); print('linear',d['controls_development']['linear_train_only_nll']); print('reserved untouched',d['reserved_test_not_opened'])"
      - name: Run small equal-step head ablation on development only
        run: python -m research.mini_gpt_synthetic.ablation > stage2_ablation.json
      - name: Save artifact without test labels
        uses: actions/upload-artifact@v4
        with:
          name: trame-stage2-synthetic-development
          path: |
            stage2_development.json
            stage2_ablation.json
