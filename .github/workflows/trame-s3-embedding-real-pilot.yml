name: TRAME S3.1B REAL learned-token pilot 36 fits
on:
  push:
    branches:
      - chatgpt/trame-s3-learned-embeddings-20261026
    paths:
      - .github/workflows/trame-s3-embedding-real-pilot.yml
  workflow_dispatch:
permissions:
  contents: read
jobs:
  real-36:
    strategy:
      fail-fast: false
      matrix:
        interval: [D1,H1,M1]
    runs-on: ubuntu-latest
    timeout-minutes: 70
    env:
      INTERVAL: ${{ matrix.interval }}
      TRAME_BTC_CACHE_DIR: /tmp/trame-btc-public
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install pinned research CPU dependencies
        run: |
          python -m pip install 'numpy==2.3.5' 'scipy==1.17.0'
          python -m pip install 'torch==2.10.0' --index-url https://download.pytorch.org/whl/cpu
      - name: Install public original BTC candles, validate their blob SHA
        run: |
          python -m research.data.public_data --resolution "$INTERVAL" --directory "$TRAME_BTC_CACHE_DIR"
          python -m research.data.public_data --resolution "$INTERVAL" --directory "$TRAME_BTC_CACHE_DIR" --check-only
      - name: Genuine BTC 12-arm grammar-v-embedding pilot
        run: |
          mkdir -p reports
          if [ "$INTERVAL" = D1 ]; then DATA_DIR=research/data/reference; else DATA_DIR="$TRAME_BTC_CACHE_DIR"; fi
          python -m research.token_grammar.learned_embeddings \
            --interval "$INTERVAL" --directory "$DATA_DIR" \
            --grammars signed_uniform_g1 signed_quantile_g2 \
            --arms decoded embedding_ordered embedding_random \
            --modes regression joint \
            --widths 16 --depths 1 --seeds 20261026 \
            --steps 40 --data-origin BTC_PUBLIC_REAL \
            --output "reports/${INTERVAL}_s3_1B_real_pilot.json"
      - name: Validate all paired 3-way groups and 2026 time quarantine
        run: |
          python - <<'PY'
          import json,os,math,hashlib
          from pathlib import Path
          from research.token_grammar.learned_embeddings_panel import panel
          iv=os.environ["INTERVAL"];p=Path(f"reports/{iv}_s3_1B_real_pilot.json")
          d=json.loads(p.read_text())
          assert d["interval"]==iv and d["data_origin"]=="BTC_PUBLIC_REAL"
          assert not d["labels_2026_opened"] and not d["independent_test_used"]
          assert d["quantile_fit_on"]=="TRAIN_PAST_CONTEXTS_ONLY"
          assert len(d["results"])==12 and d["steps"]==40 and d["dev_count"]==1024
          result=panel([d])
          assert result["n_fits"]==12 and result["n_three_arm_groups"]==4
          assert all(math.isfinite(r["mae_bps_anchor"]) for r in d["results"])
          print("AUTHENTIC REAL BTC S3.1B PILOT",iv,
            "sha256",hashlib.sha256(p.read_bytes()).hexdigest())
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: trame-s3-1B-${{ matrix.interval }}-12pilot
          path: reports/*.json
          if-no-files-found: error
          retention-days: 30
