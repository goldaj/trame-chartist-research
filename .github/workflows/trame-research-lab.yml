name: TRAME Research Lab v0.1 reproducible offline artifact
on:
  push:
    branches: [chatgpt/trame-research-lab-v01-20261025]
  pull_request:
permissions:
  contents: read
jobs:
  offline-demo:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install pinned CPU dependencies
        run: |
          python -m pip install 'numpy==2.3.5' 'scipy==1.17.0'
          python -m pip install 'torch==2.10.0' --index-url https://download.pytorch.org/whl/cpu
      - name: Unit test no-download HTML and JSON generator
        run: python -m unittest discover -s research/trame_lab -p 'test_*.py' -v
      - name: Generate full self-contained offline report
        run: python -m research.trame_lab.cli --steps 40 --output trame_research_lab.html
      - name: Verify artificial-only guardrail in machine output
        run: |
          python -c "import json;d=json.load(open('trame_research_lab.json')); assert d['market_data_accessed'] is False;assert d['financial_forecast_evaluated'] is False;assert d['paired_benchmark']['manufactured_gain_by_construction'] is True"
      - name: Publish optional report artifact for human inspection
        uses: actions/upload-artifact@v4
        with:
          name: trame-research-lab-0_1-synthetic
          path: |
            trame_research_lab.html
            trame_research_lab.json
