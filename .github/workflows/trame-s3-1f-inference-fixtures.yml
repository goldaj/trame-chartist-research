name: TRAME S3.1F same-weight inference rule causal fixtures
on:
  push:
    branches:
      - chatgpt/trame-s3-postprocess-ablation-20261026
  pull_request:
permissions:
  contents: read
jobs:
  fixtures:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Pin CPU science packages
        run: |
          python -m pip install 'numpy==2.3.5' 'scipy==1.17.0'
          python -m pip install 'torch==2.10.0' --index-url https://download.pytorch.org/whl/cpu
      - name: Verify CLI and strict same-weights output rules
        run: |
          python -m research.token_grammar.inference_ablation --help >/dev/null
          python -m research.token_grammar.inference_panel --help >/dev/null
          python -m unittest research.token_grammar.test_inference_ablation research.token_grammar.test_inference_panel -v
      - name: Guard predecessor S3.1E hard pricing and chronological reader
        run: |
          python -m unittest research.token_grammar.test_reconciliation_loss research.token_grammar.test_reconciliation_panel research.token_grammar.test_convergence -v
