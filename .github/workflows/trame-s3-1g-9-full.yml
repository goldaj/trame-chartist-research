name: TRAME S3.1G 9 REAL BTC magnitude-gated fits 108 conditional scores
on:
  push:
    branches:
      - chatgpt/trame-s3-selective-forecast-20261026
    paths:
      - .github/workflows/trame-s3-1g-9-full.yml
  workflow_dispatch:
permissions:
  contents: read
jobs:
  three-true-fits:
    strategy:
      fail-fast: false
      matrix:
        interval: [D1,H1,M1]
    runs-on: ubuntu-latest
    timeout-minutes: 160
    env:
      INTERVAL: ${{ matrix.interval }}
      TRAME_BTC_CACHE_DIR: /tmp/trame-btc-public-pre2022
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Pin CPU science dependencies
        run: |
          python -m pip install 'numpy==2.3.5' 'scipy==1.17.0'
          python -m pip install 'torch==2.10.0' --index-url https://download.pytorch.org/whl/cpu
      - name: Preflight anti-leakage, selected-subset parity and CLI
        run: |
          python -m research.token_grammar.selective_forecast --help >/dev/null
          python -m research.token_grammar.selective_panel --help >/dev/null
          python -m unittest research.token_grammar.test_selective_forecast research.token_grammar.test_selective_panel -v
      - name: Verify original public Bitstamp BTC source hashes
        run: |
          python -m research.data.public_data --resolution "$INTERVAL" --directory "$TRAME_BTC_CACHE_DIR"
          python -m research.data.public_data --resolution "$INTERVAL" --directory "$TRAME_BTC_CACHE_DIR" --check-only
      - name: Train 3 real original legacy models and score 4 train-fitted gates x3 rules
        run: |
          mkdir -p evidence
          if [ "$INTERVAL" = D1 ]; then DATA_DIR=research/data/reference; else DATA_DIR="$TRAME_BTC_CACHE_DIR"; fi
          python -m research.token_grammar.selective_forecast \
            --interval "$INTERVAL" --directory "$DATA_DIR" \
            --seeds 20261025 20261026 20261027 \
            --steps 2000 \
            --output "evidence/${INTERVAL}_S3_1G_3real_models_36conditional_cells.json"
      - name: Validate actual BTC 3 fits 36 selected cells, train-only thresholds and no future labels
        run: |
          python - <<'PY'
          import hashlib,json,os
          from pathlib import Path
          from research.token_grammar.selective_panel import validate
          iv=os.environ["INTERVAL"]
          p=Path(f"evidence/{iv}_S3_1G_3real_models_36conditional_cells.json")
          x=json.loads(p.read_text())
          validate(x)
          assert x["interval"]==iv and x["data_origin"]=="BTC_PUBLIC_REAL"
          assert x["engineering_canary_not_scientific_selection"] is False
          assert x["external_2022_2025_used"] is False
          assert x["holdout_2026_used"] is False
          assert len(x["trajectories"])==3 and len(x["results"])==36
          assert x["train_count"]>=200 and x["monitor_count"]>=200
          print("AUTHENTIC BTC S3.1G",iv,"3 actual fits, 36 dependent group scores",hashlib.sha256(p.read_bytes()).hexdigest())
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: trame-s3-1G-${{ matrix.interval }}-3real-conditional
          path: evidence/*.json
          if-no-files-found: error
          retention-days: 30

  aggregate-108:
    needs: three-true-fits
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Pin reporter dependencies
        run: |
          python -m pip install 'numpy==2.3.5' 'scipy==1.17.0'
          python -m pip install 'torch==2.10.0' --index-url https://download.pytorch.org/whl/cpu
      - uses: actions/download-artifact@v4
        with:
          pattern: trame-s3-1G-*-3real-conditional
          path: source
          merge-multiple: true
      - name: Aggregate 9 actual fits and 108 selected rule-group evaluations
        run: |
          mkdir -p summary
          python -m research.token_grammar.selective_panel \
            --inputs source/D1_S3_1G_3real_models_36conditional_cells.json source/H1_S3_1G_3real_models_36conditional_cells.json source/M1_S3_1G_3real_models_36conditional_cells.json \
            --output summary/S3_1G_9models_108conditional_scores.json \
            --markdown summary/S3_1G_9models_108conditional_scores.md
          python - <<'PY'
          import json,hashlib
          from pathlib import Path
          p=Path("summary/S3_1G_9models_108conditional_scores.json")
          x=json.loads(p.read_text())
          assert x["n_models_trained"]==9
          assert x["n_threshold_price_rule_scores"]==108
          assert len(x["summary"])==36 and len(x["paired_deltas"])==24
          assert x["thresholds_train_predictions_only"] is True
          assert x["same_selected_cases_all_rules"] is True
          assert x["external_dev_2022_2025_opened"] is False
          assert x["holdout_2026_opened"] is False
          print(Path("summary/S3_1G_9models_108conditional_scores.md").read_text())
          print("FINAL S3.1G SHA256",hashlib.sha256(p.read_bytes()).hexdigest())
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: trame-s3-1G-final-108-conditional-cells
          path: summary/*
          if-no-files-found: error
          retention-days: 30
