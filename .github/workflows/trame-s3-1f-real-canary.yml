name: TRAME S3.1F REAL pre2022 three-rule engineering smoke
on:
  push:
    branches:
      - chatgpt/trame-s3-postprocess-ablation-20261026
    paths:
      - .github/workflows/trame-s3-1f-real-canary.yml
  workflow_dispatch:
permissions:
  contents: read
jobs:
  same-weights-canary:
    strategy:
      fail-fast: false
      matrix:
        interval: [D1,H1,M1]
    runs-on: ubuntu-latest
    timeout-minutes: 75
    env:
      INTERVAL: ${{ matrix.interval }}
      TRAME_BTC_CACHE_DIR: /tmp/trame-btc-public-pre2022
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install pinned CPU research tools
        run: |
          python -m pip install 'numpy==2.3.5' 'scipy==1.17.0'
          python -m pip install 'torch==2.10.0' --index-url https://download.pytorch.org/whl/cpu
      - name: Preflight causal fixtures and CLI before BTC access
        run: |
          python -m research.token_grammar.inference_ablation --help >/dev/null
          python -m unittest research.token_grammar.test_inference_ablation research.token_grammar.test_inference_panel -v
      - name: Validate public Bitstamp spot source Git SHA
        run: |
          python -m research.data.public_data --resolution "$INTERVAL" --directory "$TRAME_BTC_CACHE_DIR"
          python -m research.data.public_data --resolution "$INTERVAL" --directory "$TRAME_BTC_CACHE_DIR" --check-only
      - name: Genuine pre2022 ONE model THREE rules (10/20/40 step engineering only)
        run: |
          mkdir -p evidence
          if [ "$INTERVAL" = D1 ]; then DATA_DIR=research/data/reference; else DATA_DIR="$TRAME_BTC_CACHE_DIR"; fi
          python -m research.token_grammar.inference_ablation \
            --interval "$INTERVAL" --directory "$DATA_DIR" \
            --engineering-canary --seeds 20261026 \
            --checkpoints 10 20 40 \
            --output "evidence/${INTERVAL}_S3_1F_canary_1model_9scores.json"
      - name: Verify exact three-rule pairing and 2022/2026 embargo
        run: |
          python - <<'PY'
          import hashlib,json,math,os
          from pathlib import Path
          from research.token_grammar.inference_panel import validate
          iv=os.environ["INTERVAL"]
          p=Path(f"evidence/{iv}_S3_1F_canary_1model_9scores.json")
          x=json.loads(p.read_text())
          validate(x,seeds=(20261026,),checkpoints=(10,20,40),allow_canary=True)
          assert x["data_origin"]=="BTC_PUBLIC_REAL" and x["interval"]==iv
          assert len(x["trajectories"])==1 and len(x["results"])==9
          assert x["external_dev_2022_2025_accessed"] is False
          assert x["holdout_2026_accessed"] is False
          assert all(math.isfinite(r["mae_bps_anchor"]) for r in x["results"])
          print("S3.1F REAL BTC CANARY",iv,"1 model,3 checks,9 dependent scores",hashlib.sha256(p.read_bytes()).hexdigest())
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: trame-s3-1F-${{ matrix.interval }}-one-model-smoke
          path: evidence/*.json
          if-no-files-found: error
          retention-days: 21
