name: TRAME D1 full research parity fabricated fixtures
on:
  push:
    branches:
      - chatgpt/trame-d1-parity-20261026
  pull_request:
permissions:
  contents: read
jobs:
  synthetic-d1:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install pinned CPU research dependencies
        run: |
          python -m pip install 'numpy==2.3.5' 'scipy==1.17.0'
          python -m pip install 'torch==2.10.0' --index-url https://download.pytorch.org/whl/cpu
      - name: Original D1 reader regression and stage A7/S1 compatibility
        run: |
          python -m unittest research.btc_h1_m1.test_daily research.btc_h1_m1.test_d1_parity research.scaling_study.test_scaling -v
      - name: Daily 45-arm grid metadata only
        run: |
          python -m research.scaling_study.runner --interval D1 --plan-only > d1_grid.json
          python -c "import json; x=json.load(open('d1_grid.json')); assert len(x['grid'])==45 and x['never_downloads_data']; assert all(not a['compute_matched'] for a in x['grid'])"
