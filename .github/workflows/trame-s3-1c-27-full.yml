name: TRAME S3.1C 27 genuine pre2022 convergence trajectories
on:
  push:
    branches:
      - chatgpt/trame-s3-training-dynamics-20261026
    paths:
      - .github/workflows/trame-s3-1c-27-full.yml
  workflow_dispatch:
permissions:
  contents: read
jobs:
  convergence-real:
    strategy:
      fail-fast: false
      matrix:
        interval: [D1,H1,M1]
    runs-on: ubuntu-latest
    timeout-minutes: 150
    env:
      INTERVAL: ${{ matrix.interval }}
      TRAME_BTC_CACHE_DIR: /tmp/trame-pre2022-public
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Pin research CPU dependencies
        run: |
          python -m pip install 'numpy==2.3.5' 'scipy==1.17.0'
          python -m pip install 'torch==2.10.0' --index-url https://download.pytorch.org/whl/cpu
      - name: Download and verify original public BTC archive
        run: |
          python -m research.data.public_data --resolution "$INTERVAL" --directory "$TRAME_BTC_CACHE_DIR"
          python -m research.data.public_data --resolution "$INTERVAL" --directory "$TRAME_BTC_CACHE_DIR" --check-only
      - name: Train 9 REAL pre2022 trajectories once to 2000 updates
        run: |
          mkdir -p evidence
          if [ "$INTERVAL" = D1 ]; then DATA_DIR=research/data/reference; else DATA_DIR="$TRAME_BTC_CACHE_DIR"; fi
          python -m research.token_grammar.training_dynamics \
            --interval "$INTERVAL" --directory "$DATA_DIR" \
            --arms decoded embedding_ordered embedding_random \
            --seeds 20261025 20261026 20261027 \
            --checkpoints 200 800 2000 \
            --output "evidence/${INTERVAL}_S3_1C_pre2022_9trajectories.json"
      - name: Enforce internal train-monitor split, full checkpoint continuity and costs
        run: |
          python - <<'PY'
          import json,os,math,hashlib
          from pathlib import Path
          from research.token_grammar.training_dynamics_panel import validate
          iv=os.environ["INTERVAL"]
          p=Path(f"evidence/{iv}_S3_1C_pre2022_9trajectories.json")
          r=json.loads(p.read_text())
          validate(r,required_seeds=(20261025,20261026,20261027))
          assert r["interval"]==iv and r["data_origin"]=="BTC_PUBLIC_REAL"
          assert len(r["trajectories"])==9 and len(r["evaluations"])==27
          assert r["external_dev_2022_2025_opened"] is False
          assert r["labels_2026_opened"] is False
          assert r["internal_monitor_never_backpropagated"] is True
          assert r["train_count"]>=200 and r["monitor_count"]>=200
          assert all(math.isfinite(x["monitor_joint_loss"]) for x in r["evaluations"])
          print("AUTHENTIC PRE2022 S3.1C",iv,"9 trajectories, 27 checkpoints",
            "SHA256",hashlib.sha256(p.read_bytes()).hexdigest())
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: trame-s3-1C-${{ matrix.interval }}-9-trajectories
          path: evidence/*.json
          if-no-files-found: error
          retention-days: 30

  aggregate-81:
    needs: convergence-real
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Pin reproducible reporter dependencies
        run: |
          python -m pip install 'numpy==2.3.5' 'scipy==1.17.0'
          python -m pip install 'torch==2.10.0' --index-url https://download.pytorch.org/whl/cpu
      - uses: actions/download-artifact@v4
        with:
          pattern: trame-s3-1C-*-9-trajectories
          path: reports
          merge-multiple: true
      - name: 27 distinct trajectories, 81 causally audited checkpoint observations
        run: |
          mkdir -p conclusion
          python -m research.token_grammar.training_dynamics_panel \
            --inputs reports/D1_S3_1C_pre2022_9trajectories.json reports/H1_S3_1C_pre2022_9trajectories.json reports/M1_S3_1C_pre2022_9trajectories.json \
            --output conclusion/S3_1C_all_27trajectories_81checkpoints.json \
            --markdown conclusion/S3_1C_all_27trajectories_81checkpoints.md
          python - <<'PY'
          import json,hashlib
          from pathlib import Path
          p=Path("conclusion/S3_1C_all_27trajectories_81checkpoints.json")
          x=json.loads(p.read_text())
          assert x["n_distinct_trajectories"]==27
          assert x["n_checkpoint_evaluations"]==81
          assert len(x["summary"])==27
          assert x["external_dev_2022_2025_opened"] is False
          assert x["labels_2026_opened"] is False
          assert x["checkpoint_evaluations_not_independent"] is True
          print(Path("conclusion/S3_1C_all_27trajectories_81checkpoints.md").read_text())
          print("SHA256",hashlib.sha256(p.read_bytes()).hexdigest())
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: trame-s3-1C-pre2022-27-final-panel
          path: conclusion/*
          if-no-files-found: error
          retention-days: 30
