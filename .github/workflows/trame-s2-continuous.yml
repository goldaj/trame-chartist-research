name: TRAME S2 continuous-direction anti-leakage fabricated fixtures
on:
  push:
    branches:
      - chatgpt/trame-continuous-direction-20261026
  pull_request:
permissions:
  contents: read
jobs:
  continuous-direction:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Pinned research CPU libraries
        run: |
          python -m pip install 'numpy==2.3.5' 'scipy==1.17.0'
          python -m pip install 'torch==2.10.0' --index-url https://download.pytorch.org/whl/cpu
      - name: S2 causal and objective fixture tests
        run: |
          python -m unittest research.continuous_direction.test_continuous research.btc_h1_m1.test_d1_parity research.scaling_study.test_panel -v
