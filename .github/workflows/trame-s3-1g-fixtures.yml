name: TRAME S3.1G train-only magnitude selection fixture tests
on:
  push:
    branches:
      - chatgpt/trame-s3-selective-forecast-20261026
  pull_request:
permissions:
  contents: read
jobs:
  guardrails:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Fixed CPU research environment
        run: |
          python -m pip install 'numpy==2.3.5' 'scipy==1.17.0'
          python -m pip install 'torch==2.10.0' --index-url https://download.pytorch.org/whl/cpu
      - name: CLI guard and adversarial selected forecast tests
        run: |
          python -m research.token_grammar.selective_forecast --help > /dev/null
          python -m research.token_grammar.selective_panel --help > /dev/null
          python -m unittest research.token_grammar.test_selective_forecast research.token_grammar.test_selective_panel -v
      - name: Confirm old inference parity unchanged
        run: |
          python -m unittest research.token_grammar.test_inference_ablation research.token_grammar.test_inference_panel -v
