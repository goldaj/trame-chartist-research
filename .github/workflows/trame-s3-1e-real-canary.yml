name: TRAME S3.1E REAL BTC hard-price reconciliation engineering smoke
on:
  push:
    branches:
      - chatgpt/trame-s3-reconciliation-loss-20261026
    paths:
      - .github/workflows/trame-s3-1e-real-canary.yml
  workflow_dispatch:
permissions:
  contents: read
jobs:
  real-coherent-smoke:
    strategy:
      fail-fast: false
      matrix:
        interval: [D1,H1,M1]
    runs-on: ubuntu-latest
    timeout-minutes: 70
    env:
      INTERVAL: ${{ matrix.interval }}
      TRAME_BTC_CACHE_DIR: /tmp/trame-btc-pre2022
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install pinned CPU toolchain
        run: |
          python -m pip install 'numpy==2.3.5' 'scipy==1.17.0'
          python -m pip install 'torch==2.10.0' --index-url https://download.pytorch.org/whl/cpu
      - name: Check CLI and artificial causal fixtures before downloading BTC
        run: |
          python -m research.token_grammar.reconciliation_loss --help >/dev/null
          python -m unittest research.token_grammar.test_reconciliation_loss research.token_grammar.test_reconciliation_panel -v
      - name: Download original BTC public data and verify pinned SHA fingerprints
        run: |
          python -m research.data.public_data --resolution "$INTERVAL" --directory "$TRAME_BTC_CACHE_DIR"
          python -m research.data.public_data --resolution "$INTERVAL" --directory "$TRAME_BTC_CACHE_DIR" --check-only
      - name: Genuine BTC three objective arms, engineering 10/20/40 only
        run: |
          mkdir -p evidence
          if [ "$INTERVAL" = D1 ]; then DATA_DIR=research/data/reference; else DATA_DIR="$TRAME_BTC_CACHE_DIR"; fi
          python -m research.token_grammar.reconciliation_loss \
            --interval "$INTERVAL" --directory "$DATA_DIR" \
            --engineering-canary --checkpoints 10 20 40 \
            --seeds 20261026 \
            --output "evidence/${INTERVAL}_S3_1E_3arms_40step_canary.json"
      - name: Assert same starting model, true hard price, 2020-21 monitor and three arms
        run: |
          python - <<'PY'
          import json,os,hashlib,math
          from pathlib import Path
          from research.token_grammar.reconciliation_panel import validate
          iv=os.environ["INTERVAL"]
          p=Path(f"evidence/{iv}_S3_1E_3arms_40step_canary.json")
          d=json.loads(p.read_text())
          validate(d,seeds=(20261026,),checkpoints=(10,20,40),allow_canary=True)
          assert d["data_origin"]=="BTC_PUBLIC_REAL" and d["interval"]==iv
          assert len(d["results"])==9
          assert d["train_count"]>=200 and d["monitor_count"]>=200
          assert d["external_2022_2025_used"] is False
          assert d["holdout_2026_used"] is False
          assert all(math.isfinite(x["mae_native_usd"]) for x in d["results"])
          print("REAL BTC PRE2022 S3.1E SMOKE",iv,hashlib.sha256(p.read_bytes()).hexdigest())
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: trame-s3-1E-${{ matrix.interval }}-engineering-3arms
          path: evidence/*.json
          if-no-files-found: error
          retention-days: 21
