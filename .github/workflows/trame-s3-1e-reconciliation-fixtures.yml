name: TRAME S3.1E hard-price soft-loss causal fixtures
on:
  push:
    branches:
      - chatgpt/trame-s3-reconciliation-loss-20261026
  pull_request:
permissions:
  contents: read
jobs:
  reconciliation-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install pinned CPU-only research stack
        run: |
          python -m pip install 'numpy==2.3.5' 'scipy==1.17.0'
          python -m pip install 'torch==2.10.0' --index-url https://download.pytorch.org/whl/cpu
      - name: Preflight CLI and loss tests on artificial returns
        run: |
          python -m research.token_grammar.reconciliation_loss --help >/dev/null
          python -m research.token_grammar.reconciliation_panel --help >/dev/null
          python -m unittest research.token_grammar.test_reconciliation_loss research.token_grammar.test_reconciliation_panel -v
      - name: Confirm S3.1D and original reference did not regress
        run: |
          python -m unittest research.token_grammar.test_loss_ablation research.token_grammar.test_loss_ablation_panel research.token_grammar.test_convergence -v
