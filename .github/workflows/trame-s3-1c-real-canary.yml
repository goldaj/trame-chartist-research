name: TRAME S3.1C REAL pre2022 convergence engineering canary
on:
  push:
    branches:
      - chatgpt/trame-s3-training-dynamics-20261026
    paths:
      - .github/workflows/trame-s3-1c-real-canary.yml
  workflow_dispatch:
permissions:
  contents: read
jobs:
  pre2022-canary:
    strategy:
      fail-fast: false
      matrix:
        interval: [D1,H1,M1]
    runs-on: ubuntu-latest
    timeout-minutes: 70
    env:
      INTERVAL: ${{ matrix.interval }}
      TRAME_BTC_CACHE_DIR: /tmp/trame-pre2022-public
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install fixed research CPU environment
        run: |
          python -m pip install 'numpy==2.3.5' 'scipy==1.17.0'
          python -m pip install 'torch==2.10.0' --index-url https://download.pytorch.org/whl/cpu
      - name: Install immutable Bitstamp public-origin history, hash verified
        run: |
          python -m research.data.public_data --resolution "$INTERVAL" --directory "$TRAME_BTC_CACHE_DIR"
          python -m research.data.public_data --resolution "$INTERVAL" --directory "$TRAME_BTC_CACHE_DIR" --check-only
      - name: Causal 2020-2021 internal train-monitor and tiny 3-arm pilot
        run: |
          mkdir -p out
          if [ "$INTERVAL" = D1 ]; then DATA_DIR=research/data/reference; else DATA_DIR="$TRAME_BTC_CACHE_DIR"; fi
          python -m research.token_grammar.training_dynamics \
            --interval "$INTERVAL" --directory "$DATA_DIR" \
            --arms decoded embedding_ordered embedding_random \
            --seeds 20261026 --checkpoints 10 20 40 \
            --output "out/${INTERVAL}_pre2022_internal_40step_canary.json"
      - name: Reject post-2021 labels, mismatched arms, interrupted optimizer
        run: |
          python - <<'PY'
          import hashlib,json,os,math
          from pathlib import Path
          iv=os.environ["INTERVAL"]
          path=Path(f"out/{iv}_pre2022_internal_40step_canary.json")
          r=json.loads(path.read_text())
          assert r["data_origin"]=="BTC_PUBLIC_REAL" and r["interval"]==iv
          assert r["external_dev_2022_2025_opened"] is False
          assert r["labels_2026_opened"] is False
          assert r["internal_monitor_never_backpropagated"] is True
          assert r["token_quantiles_fit_train_only"] is True
          assert r["checkpoints"]==[10,20,40]
          assert len(r["trajectories"])==3 and len(r["evaluations"])==9
          assert len({x["backbone_initial_sha256"] for x in r["trajectories"]})==1
          assert all(math.isfinite(x["monitor_joint_loss"]) and
                     math.isfinite(x["mae_bps_anchor"]) for x in r["evaluations"])
          print("REAL PRE2022 S3.1C CANARY",iv,
                r["train_count"],r["monitor_count"],
                "sha256",hashlib.sha256(path.read_bytes()).hexdigest())
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: trame-s3-1C-${{ matrix.interval }}-40step-engineering-canary
          path: out/*.json
          if-no-files-found: error
          retention-days: 30
