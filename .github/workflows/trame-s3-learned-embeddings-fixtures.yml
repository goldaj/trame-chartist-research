name: TRAME S3.1B learned scalar token embedding causal tests
on:
  push:
    branches:
      - chatgpt/trame-s3-learned-embeddings-20261026
  pull_request:
permissions:
  contents: read
jobs:
  causal-fixtures:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Scientific CPU dependencies
        run: |
          python -m pip install 'numpy==2.3.5' 'scipy==1.17.0'
          python -m pip install 'torch==2.10.0' --index-url https://download.pytorch.org/whl/cpu
      - name: Causal token IDs, numerics parity, matched-capacity learned initialization
        run: |
          python -m unittest research.token_grammar.test_learned_embeddings research.token_grammar.test_learned_embeddings_panel research.token_grammar.test_predictive research.token_grammar.test_predictive_panel -v
      - name: Legacy codec and true public D1 invariants
        run: |
          python -m unittest research.token_grammar.test_diagnostics research.token_grammar.test_audit research.data.test_public_data -v
